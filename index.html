<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="3-2-1!">
<meta name="description" content="İki futbol takımı seç, iki takımda da oynamış oyuncuları anında gör. Kafede oynanan 3-2-1 oyunu için.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>3-2-1! Ortak Oyuncu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://query.wikidata.org">
<link rel="preconnect" href="https://en.wikipedia.org">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0a; --card:#151513; --line:#2d2b25; --text:#f6e7c8; --muted:#8c8268; --faint:#5f584a;
    --amber:#ffb21a; --ink:#1a1100; --gold:#ffd25a; --silver:#d9d2bf; --bronze:#d8894a;
    --crest-bg:#e9e3d2; --glow:rgba(255,178,26,.65); --soft:rgba(255,178,26,.08);
    --display:"VT323",ui-monospace,monospace; --body:"IBM Plex Mono",ui-monospace,monospace;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
    --pad-b:max(12px, calc(var(--safe-b) - 8px)); --pad-t:max(12px, var(--safe-t));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);overscroll-behavior:none}
  body{margin:0;color:var(--text);overflow:hidden;font:15px/1.4 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input{-webkit-user-select:text;user-select:text}
  button{touch-action:manipulation}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input{font:inherit}
  .app{position:fixed;top:0;bottom:0;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);max-width:480px;margin:0 auto;overflow:hidden;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
               radial-gradient(100% 60% at 50% 40%,#1d1a12,var(--bg) 70%)}

  /* ---------- Ana ekran ---------- */
  .home{height:100%;display:flex;flex-direction:column;padding:calc(var(--pad-t) + 4px) 18px var(--pad-b)}
  .logo{font:clamp(40px, 6.5vh, 56px)/1 var(--display);font-size:clamp(40px, 6.5dvh, 56px);color:var(--amber);text-shadow:0 0 14px var(--glow);white-space:nowrap}
  .top{display:flex;align-items:center;justify-content:space-between}
  .lang{height:34px;min-width:46px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:var(--soft);
    font:24px/1 var(--display);color:var(--amber);letter-spacing:.06em}
  .lang:active{transform:scale(.95)}
  .match{flex:1;display:grid;grid-template-columns:1fr 56px 1fr;align-items:center;gap:6px;position:relative}
  .match::before{content:"";position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;
    border:2px solid rgba(255,178,26,.08);border-radius:50%;pointer-events:none}
  .match::after{content:"";position:absolute;left:-18px;right:-18px;top:50%;height:2px;margin-top:-1px;background:rgba(255,178,26,.08);pointer-events:none}
  .slot,.vs{position:relative;z-index:1}
  .slot{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
  .slot .crest{width:min(31vw,17vh,140px);height:min(31vw,17vh,140px);width:min(31vw,17dvh,140px);height:min(31vw,17dvh,140px);box-shadow:0 0 0 3px var(--line)}
  .slot.empty .crest{background:transparent;border:2px dashed var(--amber);box-shadow:none;color:var(--amber);font-size:48px}
  .slot .nm{font:clamp(17px,6.4vw,27px)/1 var(--display);overflow-wrap:anywhere;text-align:center;max-width:100%;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .slot.empty .nm{color:var(--muted)}
  .slot:active .crest{transform:scale(.96)}
  .vs{font:44px/1 var(--display);color:var(--amber);text-shadow:0 0 14px var(--glow);text-align:center}
  .hint{text-align:center;color:var(--muted);font-size:13px;margin:0 8px 16px;min-height:20px}
  .hint b{color:var(--text)}
  .cta{display:flex;flex-direction:column;gap:10px}
  .cta .duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .go{height:clamp(56px, 8.5vh, 72px);height:clamp(56px, 8.5dvh, 72px);border-radius:4px;background:var(--amber);color:var(--ink);font:42px/1 var(--display);letter-spacing:.06em;
    box-shadow:0 0 0 3px var(--bg),0 0 0 5px rgba(255,178,26,.5),0 0 30px rgba(255,178,26,.35);transition:transform .12s,opacity .2s}
  .go:active{transform:scale(.98)}
  .go:disabled{opacity:.25;box-shadow:none}
  .ghost{height:50px;border-radius:4px;border:1px solid var(--line);background:rgba(255,178,26,.04);font-weight:600;font-size:14px}
  .ghost:active{background:var(--soft)}

  /* ---------- Arma ve yüz ---------- */
  .crest{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:var(--crest-bg);
    color:#2b2416;font:18px/1 var(--display);overflow:hidden;flex:none;transition:transform .15s}
  .crest img{width:78%;height:78%;object-fit:contain}
  .crest.sm{width:44px;height:44px} .crest.md{width:48px;height:48px} .crest.hd{width:34px;height:34px;font-size:14px}
  .crest.xs{width:20px;height:20px;font-size:10px;border-radius:3px}
  .face{width:54px;height:54px;border-radius:4px;object-fit:cover;object-position:50% 20%;background:#24211a;flex:none;
    display:flex;align-items:center;justify-content:center;font:24px/1 var(--display);color:var(--amber);filter:sepia(.3) contrast(1.05)}
  .face.sm{width:44px;height:44px;font-size:20px}

  /* ---------- Katmanlar ---------- */
  .layer{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10;
    transition:transform .32s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .sheet{transform:translateY(102%)} .results,.career{transform:translateX(102%)}
  .layer.open{transform:none}
  .career{z-index:12}
  .bar{padding:calc(var(--pad-t) + 2px) 14px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:#121210}
  .title{font:28px/1 var(--display);text-transform:uppercase}
  .iconbtn{width:40px;height:40px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);font-size:20px;flex:none}
  .search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:4px;padding:0 12px;height:48px}
  .search:focus-within{border-color:var(--amber)}
  .search input{flex:1;min-width:0;border:0;background:none;color:var(--text);font-size:16px;outline:none;height:100%}
  .search input::placeholder{color:var(--muted)}
  .search .ic{color:var(--muted)}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--amber);animation:spin .7s linear infinite;display:none}
  .searching .spin{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .scroll{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---------- Takım / oyuncu seçme ---------- */
  .sheet-top{padding:calc(var(--pad-t) + 4px) 14px 12px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
  .sheet-title{display:flex;align-items:center;gap:10px}
  .sheet-body{padding:14px 14px calc(var(--pad-b) + 12px)}
  .label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:4px 2px 12px}
  .recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
  .recent::-webkit-scrollbar{display:none}
  .chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:4px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:13px}
  .chip .crest{width:28px;height:28px;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:14px 6px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:clamp(10.5px,3vw,11.5px);font-weight:600;text-align:center;line-height:1.15}
  .tile .crest{width:58px;height:58px}
  .tile:active .crest,.chip:active,.row:active{transform:scale(.95)}
  .rows{display:flex;flex-direction:column;gap:6px}
  .row{display:flex;align-items:center;gap:12px;padding:9px;border-radius:4px;background:var(--card);border:1px solid var(--line);text-align:left;transition:transform .12s;width:100%}
  .row b{display:block;font-weight:600}
  .row small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row>div{min-width:0}
  .empty-msg{color:var(--muted);text-align:center;padding:34px 14px;font-size:14px}

  /* ---------- Geri sayım ---------- */
  .count{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:rgba(8,8,6,.96)}
  .count.on{display:flex}
  .num{font:min(64vw,66vh,300px)/1 var(--display);color:var(--amber);text-shadow:0 0 40px var(--glow),0 0 4px var(--amber)}
  .num.pop{animation:pop .75s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes pop{0%{transform:scale(.3);opacity:0}35%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
  .count small{color:var(--muted)}

  /* ---------- Sonuçlar ---------- */
  .res-match{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-width:0}
  .res-match .t{display:flex;align-items:center;gap:6px;min-width:0;font:24px/1 var(--display)}
  .res-match .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .res-match .v{font:20px/1 var(--display);color:var(--amber)}
  .tools{padding:12px 14px 6px;display:flex;flex-direction:column;gap:10px}
  .tools-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .res-count{font:28px/1 var(--display);text-transform:uppercase}
  .res-count em{color:var(--amber);font-style:normal}
  .toggle{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:4px;border:1px solid var(--line);
    background:var(--card);font-size:13px;font-weight:600;color:var(--muted)}
  .toggle i{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--muted)}
  .toggle.on{color:var(--ink);background:var(--amber);border-color:var(--amber)}
  .toggle.on i{background:var(--ink);border-color:var(--ink)}
  .res-list{padding:6px 14px calc(var(--pad-b) + 84px);display:flex;flex-direction:column;gap:8px}
  .pl{display:grid;grid-template-columns:26px 54px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:4px;
    background:var(--card);border:1px solid var(--line);text-align:left;width:100%;animation:rise .35s both}
  .calm .pl{animation:none}
  .pl:active{transform:scale(.98)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  .rk{font:26px/1 var(--display);color:var(--muted);text-align:center}
  .pl.r1{border-color:rgba(255,178,26,.6);background:linear-gradient(100deg,rgba(255,178,26,.14),var(--card) 60%)}
  .pl.r1 .rk{color:var(--gold)} .pl.r2 .rk{color:var(--silver)} .pl.r3 .rk{color:var(--bronze)}
  .pn{font-weight:600;font-size:14px;line-height:1.25}
  .now{display:inline-block;margin-left:4px;font:600 10.5px/1.4 var(--body);padding:2px 6px;border-radius:2px;background:var(--amber);color:var(--ink);vertical-align:2px;white-space:nowrap;text-transform:none}
  .sps{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:5px}
  .sp{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fame{height:3px;background:#25231d;margin-top:7px;overflow:hidden}
  .fame i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 8px)}
  .none{padding:60px 22px;text-align:center}
  .none b{display:block;font:44px/1.05 var(--display);color:var(--amber);text-shadow:0 0 14px var(--glow);margin-bottom:12px}
  .none span{color:var(--muted);font-size:14px}
  .none .ghost{margin-top:18px;padding:0 22px}
  .res-cta{position:absolute;left:0;right:0;bottom:0;padding:14px 14px var(--pad-b);display:flex;gap:10px;
    background:linear-gradient(to top,var(--bg) 60%,transparent)}
  .res-cta .go{flex:1;height:56px;font-size:34px}
  .res-cta .ghost{width:56px;height:56px;font-size:22px}
  .skel{height:78px;border-radius:4px;background:linear-gradient(90deg,var(--card),#24211a,var(--card));background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}

  /* ---------- Kariyer ---------- */
  .hero{display:flex;align-items:center;gap:16px;padding:20px 18px 14px}
  .hero .face{width:88px;height:88px;font-size:40px}
  .hero>div:last-child{min-width:0}
  .hero h2{margin:0;font:clamp(24px,8.6vw,36px)/1 var(--display);overflow-wrap:anywhere;color:var(--amber);text-shadow:0 0 12px var(--glow)}
  .hero p{margin:6px 0 0;color:var(--muted);font-size:12.5px}
  .clubs{padding:4px 14px calc(var(--pad-b) + 16px);display:flex;flex-direction:column;gap:6px}
  .club{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:4px;background:var(--card);border:1px solid var(--line);animation:rise .3s both}
  .club b{display:block;font:clamp(21px,6.6vw,27px)/1 var(--display);overflow-wrap:anywhere}
  .club small{display:block;margin-top:3px;color:var(--faint);font-size:11.5px}
  .club.cur{border-color:rgba(255,178,26,.6)}
  .club>div{min-width:0}
  .sec{margin:14px 2px 4px}
  .minis{display:flex;flex-direction:column;border-top:1px solid var(--line)}
  .mini{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  .mini .crest{width:24px;height:24px;font-size:10px}
  .mini span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mini small{margin-left:auto;color:var(--faint);font-size:11px;white-space:nowrap}

  /* ---------- Cihaz uyumu ---------- */
  /* Dar telefonlar: sonuç başlığında arma üstte, isim altta (isimler kesilmesin) */
  @media (max-width:430px){
    .res-match{align-items:flex-start}
    .res-match .t{flex:1;flex-direction:column;gap:5px;font-size:clamp(16px,5.2vw,22px)}
    .res-match .t:last-child{flex-direction:column-reverse}
    .res-match .t span:not(.crest){white-space:normal;text-align:center;max-width:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
    .res-match .v{margin-top:8px}
  }
  @media (max-width:340px){
    .cta .ghost{font-size:12px}
    .cta .duo{grid-template-columns:auto 1fr;gap:8px}
    .cta #random{padding:0 10px}
    .res-count{font-size:23px}
    .pl{grid-template-columns:20px 46px 1fr;gap:9px;padding:9px}
    .pl .face{width:46px;height:46px}
  }
  /* Kısa ekran (tarayıcı çubukları açıkken) */
  @media (max-height:600px){
    .hint{margin-bottom:8px}
    .ghost{height:46px}
  }
  /* Yatay telefon: solda takımlar, sağda butonlar */
  @media (orientation:landscape) and (max-height:500px){
    .app{max-width:900px}
    .home{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:auto 1fr auto;column-gap:22px}
    .home .top{grid-column:1 / -1}
    .home .match{grid-column:1;grid-row:2 / 4}
    .home .hint{grid-column:2;grid-row:2;align-self:end}
    .home .cta{grid-column:2;grid-row:3;align-self:end}
    .logo{font-size:36px}
    .slot{gap:8px}
    .slot .crest{width:min(33vh,17vw,130px);height:min(33vh,17vw,130px)}
    .slot .nm{font-size:22px}
    .match::before{width:150px;height:150px;margin:-75px 0 0 -75px}
    .go{height:54px}
    .ghost{height:44px}
    .bar,.sheet-top{padding-top:calc(var(--pad-t) - 4px);padding-bottom:8px}
    .sheet-top{flex-direction:row;align-items:center}
    .sheet-top .search{flex:1;height:42px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
    .tools{flex-direction:row;align-items:center;padding:8px 14px 4px}
    .tools-row{flex:none}
    .tools .search{flex:1;min-width:0;height:38px}
    .res-count{font-size:23px;white-space:nowrap}
    .res-cta{left:auto;width:min(320px,50%);padding-top:8px;background:none}
    .res-cta .go,.res-cta .ghost{height:46px}
    .res-cta .ghost{background:var(--card)}
    .res-list{padding-bottom:calc(var(--pad-b) + 62px)}
  }
  @media (min-width:520px) and (min-height:501px){ .app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
  @media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="app">

  <!-- ANA EKRAN -->
  <section class="home">
    <div class="top"><div class="logo">3-2-1!</div><button class="lang" id="lang" aria-label="Language"></button></div>
    <div class="match">
      <button class="slot empty" id="slotA"></button>
      <div class="vs">VS</div>
      <button class="slot empty" id="slotB"></button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="cta">
      <button class="go" id="go" disabled>3 · 2 · 1</button>
      <div class="duo">
        <button class="ghost" id="random">🎲 Rastgele</button>
        <button class="ghost" id="careerBtn">👤 Oyuncu kariyeri</button>
      </div>
    </div>
  </section>

  <!-- TAKIM / OYUNCU SEÇ -->
  <section class="layer sheet" id="sheet" aria-hidden="true">
    <div class="sheet-top">
      <div class="sheet-title">
        <button class="iconbtn" data-back aria-label="Kapat">✕</button>
        <span class="title" id="sheetTitle"></span>
      </div>
      <label class="search" id="searchBox">
        <span class="ic">⌕</span>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search">
        <span class="spin"></span>
      </label>
    </div>
    <div class="scroll sheet-body" id="sheetBody"></div>
  </section>

  <!-- SONUÇLAR -->
  <section class="layer results" id="results" aria-hidden="true">
    <div class="bar">
      <button class="iconbtn" data-back aria-label="Geri">←</button>
      <div class="res-match" id="resMatch"></div>
      <div style="width:12px"></div>
    </div>
    <div class="tools" id="tools">
      <div class="tools-row">
        <div class="res-count" id="resCount"></div>
        <button class="toggle" id="onlyNow"><i></i>Güncel</button>
      </div>
      <label class="search">
        <span class="ic">⌕</span>
        <input id="filter" type="search" placeholder="Listede oyuncu ara…" autocomplete="off">
      </label>
    </div>
    <div class="scroll"><div class="res-list" id="resList"></div></div>
    <div class="res-cta">
      <button class="ghost" id="resRandom" aria-label="Rastgele eşleşme">🎲</button>
      <button class="go" id="again">YENİ TUR</button>
    </div>
  </section>

  <!-- KARİYER -->
  <section class="layer career" id="career" aria-hidden="true">
    <div class="bar">
      <button class="iconbtn" data-back aria-label="Geri">←</button>
      <span class="title">Kariyer</span>
    </div>
    <div class="scroll" id="careerBody"></div>
  </section>

  <!-- GERİ SAYIM -->
  <div class="count" id="count"><div class="num" id="num">3</div><small>geçmek için dokun</small></div>
</div>

<script>
/* =========================================================
   AYARLAR VE VERİ
   ========================================================= */
/* =========================================================
   DİL (TR / EN) — telefon dili Türkçe değilse İngilizce açılır,
   seçim hatırlanır. Sol üstteki butonla değiştirilir.
   ========================================================= */
const LANG = (() => {
  try { const v = JSON.parse(localStorage.getItem('lang')); if (v === 'tr' || v === 'en') return v; } catch {}
  return /^tr\b/i.test(navigator.language || '') ? 'tr' : 'en';
})();

/* ---------- Wikipedia bilgi kutuları (Türkçe + İngilizce) ---------- */
async function wikiText(wiki, title){
  const d = await getJSON(`https://${wiki}.wikipedia.org/w/api.php?` + new URLSearchParams({ action:'parse', format:'json', origin:'*', prop:'wikitext', section:'0', redirects:'1', page:title }), null, 8000);
  return d.parse?.wikitext?.['*'] || '';
}
const stripRefs = v => v.replace(/<ref[^>]*\/>/g, '').replace(/<ref[^>]*>[\s\S]*?<\/ref>/g, '').replace(/<!--[\s\S]*?-->/g, '');
// Bilgi kutusundaki "| alan = değer" satırları
function infoboxParams(w){
  const out = {};
  for (const line of stripRefs(w).split('\n')) {
    const m = line.match(/^\s*\|\s*([^=|{}\[\]]+?)\s*=(.*)$/);
    if (m) out[m[1].trim().toLocaleLowerCase('tr').replace(/\s+/g, '')] = m[2].trim();
  }
  return out;
}
const linkOf = v => { const m = v && v.match(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/); return m ? { title: m[1].trim(), text: m[2] ? m[2].replace(/'''?/g, '').trim() : m[1].trim() } : null; };
function yearsOf(v){
  const m = (v || '').match(/(\d{4})(\s*[-–—]\s*(\d{4})?)?/);
  if (!m) return [null, null];
  return [+m[1], m[3] ? +m[3] : (m[2] ? null : +m[1])];
}
// Altyapı / yedek / genç milli takım mı? (Barcelona B, Jong Ajax, Castilla, U21, 19 yaş altı…)
const isYouthName = s => /(\bU-?\s?\d{2}\b|under[\s-]?\d{2}|\d{2}\s*yaş\s*altı|olympic|olimpi|\byouth\b|academy|akademi|altyapı|reserves?\b|\bcastilla\b|atl[eè]tic\b|primavera|^jong\s|\bjuvenil|\s(B|C|II|III|A2)$)/i.test(s || '');
const NOT_PLAYING = /coach|manager|assistant|director|retired|free agent|unattached|without|president|chairman|scout|teknik direktör|antrenör|emekli|serbest|kulüpsüz|yardımcı/i;
// Şu anki kulüp: İngilizce "current_club", Türkçe "bulunduğukulüp"
function currentClubOf(P){
  const raw = P['current_club'] ?? P['currentclub'] ?? P['bulunduğukulüp'] ?? P['şimdikikulüp'];
  if (!raw || NOT_PLAYING.test(raw)) return null;
  return linkOf(raw);
}

const NATS = { TUR:'Türkiye', GER:'Almanya', NED:'Hollanda', BRA:'Brezilya', ARG:'Arjantin', FRA:'Fransa', ESP:'İspanya', ITA:'İtalya',

  SUI:'İsviçre', POL:'Polonya', CZE:'Çekya', GRE:'Yunanistan', ROU:'Romanya', BUL:'Bulgaristan', UKR:'Ukrayna', RUS:'Rusya', SWE:'İsveç',
  NOR:'Norveç', DEN:'Danimarka', MKD:'Kuzey Makedonya', ALB:'Arnavutluk', KVX:'Kosova', KOS:'Kosova', MNE:'Karadağ', SVN:'Slovenya',
  SVK:'Slovakya', HUN:'Macaristan', GEO:'Gürcistan', AZE:'Azerbaycan', IRN:'İran', JPN:'Japonya', KOR:'Güney Kore', AUS:'Avustralya',
  CHI:'Şili', PAR:'Paraguay', PER:'Peru', ECU:'Ekvador', EGY:'Mısır', TUN:'Tunus', MLI:'Mali', SCO:'İskoçya', WAL:'Galler',
  ISL:'İzlanda', FIN:'Finlandiya', ISR:'İsrail', CAN:'Kanada' };
function natOf(v){
  const l = linkOf(v);
  if (l) return { title: l.title, text: l.text, youth: isYouthName(l.text) || isYouthName(l.title) };
  const m = v.match(/\{\{\s*(fbu|fb)\s*\|([^}]*)\}\}/i);
  if (!m) return null;
  const parts = m[2].split('|').map(s => s.trim());
  const named = parts.find(x => /^name\s*=/.test(x))?.split('=')[1]?.trim();
  const pos = parts.filter(x => !x.includes('='));
  const youth = m[1].toLowerCase() === 'fbu';
  const country = NATS[(youth ? pos[1] : pos[0] || '').toUpperCase()];
  if (!country) return null;
  return { title: `${country} millî futbol takımı`, wiki: 'tr', text: named || (youth ? `${country} U-${pos[0]}` : country), youth };
}
function infoboxCareer(P, wiki){
  const keys = wiki === 'tr'
    ? [['club','kulüp','kulüpyıl'], ['youth','altyapıkulübü','altyapıyıl'], ['nat','millitakım','milliyıl']]
    : [['club','clubs','years'], ['youth','youthclubs','youthyears'], ['nat','nationalteam','nationalyears']];
  const out = [];
  for (const [kind, ck, yk] of keys) for (let i = 1; i <= 40; i++) {
    const v = P[ck + i]; if (!v) continue;
    const sp = yearsOf(P[yk + i]);
    if (kind === 'nat') { const n = natOf(v); if (n) out.push({ kind: n.youth ? 'youth' : 'nat', nat: true, wiki: n.wiki || wiki, title: n.title, text: n.text, sp }); continue; }
    const l = linkOf(v); if (!l) continue;
    out.push({ kind: kind === 'youth' || isYouthName(l.text) ? 'youth' : 'club', wiki, title: l.title, text: l.text, sp });
  }
  return out;
}
// Wikipedia sayfa adı -> Wikidata ID (yönlendirmeler dahil)
async function titlesToQ(wiki, titles){
  const out = {};
  for (let i = 0; i < titles.length; i += 50) {
    const part = titles.slice(i, i + 50);
    const d = await getJSON(`https://${wiki}.wikipedia.org/w/api.php?` + new URLSearchParams({ action:'query', format:'json', origin:'*',
      prop:'pageprops', ppprop:'wikibase_item', redirects:'1', titles: part.join('|') }), null, 8000);
    const jump = {}; [...(d.query?.normalized || []), ...(d.query?.redirects || [])].forEach(n => jump[n.from] = n.to);
    const pages = {}; Object.values(d.query?.pages || {}).forEach(pg => { if (pg.pageprops?.wikibase_item) pages[pg.title] = pg.pageprops.wikibase_item; });
    part.forEach(t => { let k = t; for (let j = 0; j < 3 && jump[k]; j++) k = jump[k]; if (pages[k]) out[t] = pages[k]; });
  }
  return out;
}
async function sitelinksOf(ids){
  const out = {};
  for (let i = 0; i < ids.length; i += 50) {
    const d = await getJSON(`${API}?` + new URLSearchParams({ action:'wbgetentities', format:'json', origin:'*', props:'sitelinks',
      sitefilter:'enwiki|trwiki', ids: ids.slice(i, i + 50).join('|') }), null, 8000);
    Object.values(d.entities || {}).forEach(e => out[e.id] = e.sitelinks || {});
  }
  return out;
}

/* ---------- Wikipedia kategorileri: "Galatasaray SK futbolcuları" ---------- */
async function teamCategories(id){
  const key = 'cat_v1:' + id, c = LS.get(key);
  if (c && Date.now() - c.t < 24 * 3600e3) return c.d;
  const res = { tr: null, en: null };
  const cl = await getJSON(`${API}?action=wbgetclaims&format=json&origin=*&property=P6112&entity=${id}`, null, 6000);
  const cid = cl.claims?.P6112?.[0]?.mainsnak?.datavalue?.value?.id;
  const sl = await sitelinksOf([id, cid].filter(Boolean));
  if (cid) { res.tr = sl[cid]?.trwiki?.title || null; res.en = sl[cid]?.enwiki?.title || null; }
  if (!res.tr && sl[id]?.trwiki) res.tr = 'Kategori:' + sl[id].trwiki.title.replace(/\s*\(futbol takımı\)/, '') + ' futbolcuları';
  LS.set(key, { t: Date.now(), d: res });
  return res;
}
async function catMembers(wiki, cat){
  const key = 'catm_v1:' + wiki + ':' + cat, c = LS.get(key);
  if (c && Date.now() - c.t < 24 * 3600e3) return c.d;
  const out = []; let cont = null;
  for (let i = 0; i < 10; i++) {
    const p = { action:'query', format:'json', origin:'*', list:'categorymembers', cmtitle:cat, cmnamespace:'0', cmlimit:'500' };
    if (cont) p.cmcontinue = cont;
    const d = await getJSON(`https://${wiki}.wikipedia.org/w/api.php?` + new URLSearchParams(p), null, 8000);
    (d.query?.categorymembers || []).forEach(m => out.push(m.title));
    cont = d.continue?.cmcontinue; if (!cont) break;
  }
  LS.set(key, { t: Date.now(), d: out });
  return out;
}
// İki takımın kategorilerinde birden olan oyuncular (Wikidata ID listesi)
async function categoryCommon(a, b){
  const [ca, cb] = await Promise.all([teamCategories(a), teamCategories(b)]);
  const out = new Set();
  await Promise.all(['tr', 'en'].map(async w => {
    if (!ca[w] || !cb[w]) return;
    try {
      const [ma, mb] = await Promise.all([catMembers(w, ca[w]), catMembers(w, cb[w])]);
      const inB = new Set(mb), common = ma.filter(t => inB.has(t));
      Object.values(await titlesToQ(w, common)).forEach(id => out.add(id));
    } catch {}
  }));
  return [...out];
}

// Aynı anda en fazla n istek
async function pool(items, n, fn){
  const out = []; let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
    while (i < items.length) { const k = i++; try { out[k] = await fn(items[k]); } catch { out[k] = null; } }
  }));
  return out;
}

/* =========================================================
   İSTEKLER
   ========================================================= */
async function getJSON(url, signal, ms = 9000){
  const c = new AbortController();
  const t = setTimeout(() => c.abort(new Error(TEXT.slow)), ms);
  signal?.addEventListener('abort', () => c.abort(signal.reason), { once: true });
  try {
    const res = await fetch(url, { signal: c.signal });
    if (!res.ok) throw new Error(TEXT.noResp + ' (' + res.status + ')');
    return await res.json();
  } finally { clearTimeout(t); }
}
const sparql = async (q, signal, ms) => (await getJSON(SPARQL + '?format=json&query=' + encodeURIComponent(q), signal, ms)).results.bindings;
const ids2values = ids => ids.map(i => 'wd:' + i).join(' ');
const LABELS = v => `OPTIONAL { ${v} rdfs:label ?tr FILTER(LANG(?tr) = "tr") } OPTIONAL { ${v} rdfs:label ?mul FILTER(LANG(?mul) = "mul") }
  OPTIONAL { ${v} rdfs:label ?en FILTER(LANG(?en) = "en") }
  OPTIONAL { ${v} schema:description ?dtr FILTER(LANG(?dtr) = "tr") } OPTIONAL { ${v} schema:description ?den FILTER(LANG(?den) = "en") }`;

// Arama: hem "baştan eşleşen" arama hem de tam metin araması. Böylece "osimhen" yazınca
// "Victor Osimhen" da bulunur (eski arama sadece ismin başından eşleştiriyordu).
async function findIds(text, filter, signal){
  const prefix = getJSON(`${API}?action=wbsearchentities&format=json&origin=*&language=${LANG}&uselang=${LANG}&type=item&limit=12&search=${encodeURIComponent(text)}`, signal, 6000)
    .then(d => (d.search || []).map(i => i.id)).catch(() => []);
  const full = getJSON(`${API}?` + new URLSearchParams({ action:'query', list:'search', format:'json', origin:'*', srlimit:'12', srsearch:`${text} ${filter}` }), signal, 6000)
    .then(d => (d.query?.search || []).map(x => x.title)).catch(() => []);
  const [a, b] = await Promise.all([full, prefix]);
  return [...new Set([...a, ...b])].filter(id => /^Q\d+$/.test(id)).slice(0, 24);
}

const WIKIS = ['en','tr','es','it','de','fr','pt','nl'];   // logo aranacak Wikipedia dilleri

async function searchTeams(text, signal){
  const ids = await findIds(text, 'haswbstatement:P31=Q476028', signal);
  if (!ids.length) return [];
  const rows = await sparql(`SELECT ?t ?links ?tr ?mul ?en ?dtr ?den WHERE {
      VALUES ?t { ${ids2values(ids)} } ?t wdt:P31 ?c . VALUES ?c { ${CLASSES} } ?t wikibase:sitelinks ?links .
      ${LABELS('?t')} }`, signal);
  const meta = {};
  rows.forEach(r => { meta[qid(r.t.value)] ??= { name: label(r), desc: descOf(r), links: +r.links.value }; });
  const teams = Object.entries(meta).filter(([, m]) => m.name)
    .map(([id, m]) => ({ id, name: shortName(m.name), desc: m.desc, links: m.links }))
    .sort((x, y) => y.links - x.links).slice(0, 8);
  teams.forEach(t => names[t.id] ??= t.name);
  ensureLogos(teams.map(t => t.id));
  return teams;
}

async function searchPlayers(text, signal){
  const ids = await findIds(text, `haswbstatement:P106=${FOOTBALLER.slice(3)}`, signal);
  if (!ids.length) return [];
  const rows = await sparql(`SELECT ?p ?links ?img ?tr ?mul ?en ?dtr ?den WHERE {
      VALUES ?p { ${ids2values(ids)} } ?p wdt:P106 ${FOOTBALLER} ; wikibase:sitelinks ?links .
      OPTIONAL { ?p wdt:P18 ?img } ${LABELS('?p')} }`, signal);
  const out = {};
  rows.forEach(r => { out[qid(r.p.value)] ??= { id: qid(r.p.value), name: label(r), desc: descOf(r), img: r.img?.value || null, links: +r.links.value }; });
  return Object.values(out).filter(p => p.name).sort((x, y) => y.links - x.links).slice(0, 10);
}

// Logo sırası: İngilizce Wikipedia arması → Wikidata logosu → diğer dillerdeki Wikipedia görselleri
async function pageImages(wiki, titles){
  const out = {};
  for (let i = 0; i < titles.length; i += 50) {
    const part = titles.slice(i, i + 50);
    const p = new URLSearchParams({ action:'query', format:'json', origin:'*', prop:'pageimages', piprop:'thumbnail',
      pithumbsize:'160', pilicense:'any', pilimit:'50', redirects:'1', titles:part.join('|') });
    const d = await getJSON(`https://${wiki}.wikipedia.org/w/api.php?` + p);
    const jump = {}; [...(d.query?.normalized || []), ...(d.query?.redirects || [])].forEach(n => jump[n.from] = n.to);
    const pages = {}; Object.values(d.query?.pages || {}).forEach(pg => { if (pg.thumbnail) pages[pg.title] = pg.thumbnail.source; });
    part.forEach(t => { let k = t; for (let j = 0; j < 3 && jump[k]; j++) k = jump[k]; if (pages[k]) out[t] = pages[k]; });
  }
  return out;
}
const logoBusy = new Set();
async function ensureLogos(ids){
  const need = [...new Set(ids)].filter(id => /^Q\d+$/.test(id || '') && !(id in logos) && !logoBusy.has(id));
  if (!need.length) return paintLogos();
  need.forEach(id => logoBusy.add(id));
  let failed = false;
  try {
    // Her takımın farklı dillerdeki Wikipedia sayfa adları
    const titles = {};
    for (let i = 0; i < need.length; i += 50) {
      const d = await getJSON(`${API}?` + new URLSearchParams({ action:'wbgetentities', format:'json', origin:'*', props:'sitelinks',
        sitefilter: WIKIS.map(w => w + 'wiki').join('|'), ids: need.slice(i, i + 50).join('|') }), null, 8000);
      Object.values(d.entities || {}).forEach(e => {
        titles[e.id] = {};
        Object.values(e.sitelinks || {}).forEach(sl => titles[e.id][sl.site.replace('wiki', '')] = sl.title);
      });
    }
    for (const src of ['en', 'P154', ...WIKIS.slice(1)]) {
      const left = need.filter(id => !logos[id]);
      if (!left.length) break;
      if (src === 'P154') {   // Wikidata'daki resmi logo dosyası
        await pool(left, 6, async id => {
          const d = await getJSON(`${API}?action=wbgetclaims&format=json&origin=*&property=P154&entity=${id}`, null, 6000);
          const f = d.claims?.P154?.[0]?.mainsnak?.datavalue?.value;
          if (f) logos[id] = `https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(f)}?width=160`;
        });
      } else {
        const want = [...new Set(left.map(id => titles[id]?.[src]).filter(Boolean))];
        if (!want.length) continue;
        try {
          const th = await pageImages(src, want);
          left.forEach(id => { const t = titles[id]?.[src]; if (t && th[t]) logos[id] = th[t]; });
        } catch { failed = true; }
      }
      paintLogos();
    }
  } catch { failed = true; }
  finally {
    need.forEach(id => { logoBusy.delete(id); if (!logos[id]) { if (failed) delete logos[id]; else logos[id] = ''; } });
    LS.set('logos_v2', logos);
    paintLogos();
  }
}

// İki takımda da oynamış oyuncular: Wikidata + Türkçe/İngilizce Wikipedia kategorileri
const PLAYER_LABELS = `OPTIONAL { ?p rdfs:label ?tr  FILTER(LANG(?tr)  = "tr")  }
      OPTIONAL { ?p rdfs:label ?mul FILTER(LANG(?mul) = "mul") }
      OPTIONAL { ?p rdfs:label ?en  FILTER(LANG(?en)  = "en")  }`;
async function fetchPair(a, b){
  const key = `pair_v6:${LANG}:` + pairKey(a, b);
  const cached = LS.get(key);
  if (cached && Date.now() - cached.t < 6 * 3600e3) return cached.d;

  const [rows, catIds] = await Promise.all([
    sparql(`SELECT ?p ?links ?img ?team ?start ?end ?tr ?mul ?en WHERE {
      ?p p:P54/ps:P54 wd:${a} . ?p p:P54/ps:P54 wd:${b} . ?p wikibase:sitelinks ?links .
      ?p p:P54 ?st . ?st ps:P54 ?team . VALUES ?team { wd:${a} wd:${b} }
      OPTIONAL { ?st pq:P580 ?start } OPTIONAL { ?st pq:P582 ?end } OPTIONAL { ?p wdt:P18 ?img }
      ${PLAYER_LABELS} }`, null, 20000),
    categoryCommon(a, b).catch(() => []),
  ]);

  const map = new Map();
  const add = r => {
    const id = qid(r.p.value);
    if (!map.has(id)) map.set(id, { id, name: label(r) || id, links: +r.links.value, img: r.img?.value || null, s: { [a]:[], [b]:[] }, now: null });
    if (!r.team) return;
    const sp = [yr(r.start?.value), yr(r.end?.value)];
    const list = map.get(id).s[qid(r.team.value)];
    if (list && !list.some(x => x[0] === sp[0] && x[1] === sp[1])) list.push(sp);
  };
  rows.forEach(add);

  // Wikidata'da kaydı eksik olup Wikipedia kategorilerinde iki takımda da görünenler
  const extras = catIds.filter(id => !map.has(id));
  if (extras.length) {
    const rows2 = await sparql(`SELECT ?p ?links ?img ?team ?start ?end ?tr ?mul ?en WHERE {
        VALUES ?p { ${ids2values(extras)} } ?p wikibase:sitelinks ?links . OPTIONAL { ?p wdt:P18 ?img }
        OPTIONAL { ?p p:P54 ?st . ?st ps:P54 ?team . VALUES ?team { wd:${a} wd:${b} }
                   OPTIONAL { ?st pq:P580 ?start } OPTIONAL { ?st pq:P582 ?end } }
        ${PLAYER_LABELS} }`, null, 15000).catch(() => []);
    rows2.forEach(add);
  }

  const d = [...map.values()];
  d.forEach(p => Object.values(p.s).forEach(l => l.sort((x, y) => (x[0] || 0) - (y[0] || 0))));
  if (d.length) LS.set(key, { t: Date.now(), d, verified: false });   // boş sonucu saklama (geçici hata olabilir)
  return d;
}

/* ---------- Veri kaynağı seçimi (uygulamanın dilinden BAĞIMSIZ) ----------
   - Kulüp listesi: Türkçe ve İngilizce Wikipedia'dan kariyeri daha eksiksiz olan
     (eşitse daha yeni güncellenen) bilgi kutusu.
   - "Şu an": bu bilgiyi içeren sayfalardan EN SON güncellenen sayfaya güvenilir. */
async function wikiPage(wiki, title){
  const d = await getJSON(`https://${wiki}.wikipedia.org/w/api.php?` + new URLSearchParams({ action:'query', format:'json', origin:'*',
    prop:'revisions', rvprop:'content|timestamp', rvslots:'main', rvsection:'0', redirects:'1', titles:title }), null, 8000);
  const rev = Object.values(d.query?.pages || {})[0]?.revisions?.[0];
  const text = rev?.slots?.main?.['*'] ?? rev?.slots?.main?.content ?? '';
  return { wiki, P: infoboxParams(text), ts: rev?.timestamp || '' };
}
async function playerPages(sl){
  const jobs = [];
  if (sl.enwiki) jobs.push(wikiPage('en', sl.enwiki.title).catch(() => null));
  if (sl.trwiki) jobs.push(wikiPage('tr', sl.trwiki.title).catch(() => null));
  return (await Promise.all(jobs)).filter(Boolean);
}
const CUR_KEYS = ['current_club', 'currentclub', 'bulunduğukulüp', 'şimdikikulüp'];
function newestCurrent(pages){
  const withKey = pages.filter(pg => CUR_KEYS.some(k => k in pg.P)).sort((x, y) => y.ts.localeCompare(x.ts));
  if (!withKey.length) return null;
  const l = currentClubOf(withKey[0].P);
  return l ? { ...l, wiki: withKey[0].wiki } : null;
}
// Takım adları her zaman Wikidata'dan, uygulamanın dilinde
async function labelsOf(ids){
  const out = {};
  for (let i = 0; i < ids.length; i += 50) {
    const d = await getJSON(`${API}?` + new URLSearchParams({ action:'wbgetentities', format:'json', origin:'*', props:'labels',
      languages:'tr|en|mul', ids: ids.slice(i, i + 50).join('|') }), null, 8000);
    Object.values(d.entities || {}).forEach(e => {
      const L = e.labels || {}, pick = LANG === 'en' ? (L.en || L.mul || L.tr) : (L.tr || L.mul || L.en);
      if (pick) out[e.id] = pick.value;
    });
  }
  return out;
}
// "Turkey national football team" -> "Turkey", "Türkiye millî futbol takımı" -> "Türkiye"
const natName = n => n.replace(/\s*mill[iî]\s+futbol\s+takımı/i, '')
  .replace(/\s+national\s+under-(\d+)\s+(association\s+)?football\s+team/i, ' U-$1')
  .replace(/\s+national\s+(association\s+)?football\s+team/i, '').replace(/\s+men['’]s(?=\s|$)/i, '').trim();

// "Şu an" doğrulaması (iki takım eşleşmesi). Sonuçları bekletmez, arka planda çalışır.
async function verifyPair(a, b, d){
  const key = `pair_v6:${LANG}:` + pairKey(a, b);
  if (LS.get(key)?.verified) return false;
  const cand = d.filter(p => Object.values(p.s).some(l => !l.length || l.some(sp => (sp[0] && !sp[1]) || (sp[1] && sp[1] >= NOW - 1))))
    .sort((x, y) => y.links - x.links).slice(0, 30);
  d.forEach(p => p.now = null);
  if (cand.length) {
    const sl = await sitelinksOf(cand.map(p => p.id));
    const links = await pool(cand, 6, async p => newestCurrent(await playerPages(sl[p.id] || {})));
    const want = { tr: new Set(), en: new Set() };
    links.forEach(l => l && want[l.wiki].add(l.title));
    const q = { tr: {}, en: {} };
    await Promise.all(['tr', 'en'].map(async w => { if (want[w].size) q[w] = await titlesToQ(w, [...want[w]]); }));
    cand.forEach((p, i) => { const l = links[i], cq = l && q[l.wiki][l.title]; if (cq === a || cq === b) p.now = cq; });
  }
  LS.set(key, { t: Date.now(), d, verified: true });
  return true;
}

// Bir oyuncunun kariyeri: Wikidata + en iyi Wikipedia bilgi kutusu
async function fetchCareer(id){
  const key = `career_v5:${LANG}:` + id;
  const cached = LS.get(key);
  if (cached && Date.now() - cached.t < 6 * 3600e3) return cached.d;

  const [rows, sl] = await Promise.all([
    sparql(`SELECT ?team ?start ?end ?tr ?mul ?en ?nat WHERE {
      wd:${id} p:P54 ?st . ?st ps:P54 ?team .
      OPTIONAL { ?st pq:P580 ?start } OPTIONAL { ?st pq:P582 ?end }
      OPTIONAL { ?team rdfs:label ?tr  FILTER(LANG(?tr)  = "tr")  }
      OPTIONAL { ?team rdfs:label ?mul FILTER(LANG(?mul) = "mul") }
      OPTIONAL { ?team rdfs:label ?en  FILTER(LANG(?en)  = "en")  }
      BIND(EXISTS { ?team wdt:P31 wd:Q6979593 } AS ?nat) }`, null, 15000).catch(() => []),
    sitelinksOf([id]).then(x => x[id] || {}).catch(() => ({})),
  ]);

  // 1) Wikidata'daki takımlar
  const wd = new Map();
  for (const r of rows) {
    const tid = qid(r.team.value);
    const nat = r.nat?.value === 'true' || /\bnational\b/i.test(r.en?.value || '') || /mill[iî]/i.test(r.tr?.value || '');
    const youth = isYouthName(r.en?.value) || isYouthName(r.tr?.value) || isYouthName(label(r));
    let name = shortName(label(r) || tid);
    if (nat) name = natName(name);
    if (!wd.has(tid)) wd.set(tid, { id: tid, logo: tid, name, kind: youth ? 'youth' : nat ? 'nat' : 'club', s: [] });
    const sp = [yr(r.start?.value), yr(r.end?.value)], t = wd.get(tid);
    if (!t.s.some(x => x[0] === sp[0] && x[1] === sp[1])) t.s.push(sp);
  }

  // 2) Wikipedia: en eksiksiz bilgi kutusu ve en güncel "şu anki kulüp"
  const pages = await playerPages(sl);
  const clubCount = ib => ib.filter(e => e.kind === 'club').length;
  const best = pages.map(pg => ({ pg, ib: infoboxCareer(pg.P, pg.wiki) }))
    .sort((x, y) => (clubCount(y.ib) - clubCount(x.ib)) || y.pg.ts.localeCompare(x.pg.ts))[0];
  const ib = best?.ib || [];
  const curL = newestCurrent(pages);

  const want = { tr: new Set(), en: new Set() };
  ib.forEach(e => want[e.wiki].add(e.title));
  if (curL) want[curL.wiki].add(curL.title);
  const q = { tr: {}, en: {} };
  await Promise.all(['tr', 'en'].map(async w => { if (want[w].size) q[w] = await titlesToQ(w, [...want[w]]).catch(() => ({})); }));
  const resolved = [...new Set(ib.map(e => q[e.wiki][e.title]).filter(Boolean))];
  const lbl = resolved.length ? await labelsOf(resolved).catch(() => ({})) : {};

  // 3) Birleştir (isimler hangi Wikipedia kullanılırsa kullanılsın aynı: Wikidata etiketi)
  const teams = new Map();
  const put = (k, base, sp) => {
    if (!teams.has(k)) teams.set(k, { ...base, s: [] });
    const t = teams.get(k);
    if (!t.s.some(x => x[0] === sp[0] && x[1] === sp[1])) t.s.push(sp);
  };
  const hasClubs = ib.some(e => e.kind === 'club'), hasYouth = ib.some(e => e.kind === 'youth');
  const seen = new Set();
  for (const e of ib) {
    const tq = q[e.wiki][e.title] || null;
    if (e.kind === 'youth' && e.nat) {        // genç milli takım: "Türkiye U-21" (logo: A milli takım)
      const age = (e.text.match(/(\d{2})/) || [])[1];
      const name = tq && lbl[tq] && age ? `${natName(lbl[tq])} U-${age}` : e.text;
      put('y:' + name, { id: 'x:' + name, logo: tq, name, kind: 'youth' }, e.sp);
      continue;
    }
    const name = e.kind === 'nat' ? natName(lbl[tq] || e.text)
      : (isYouthName(e.text) || !lbl[tq]) ? e.text : shortName(lbl[tq]);
    const tid = tq || 'x:' + e.text;
    if (tq) seen.add(tq + ':' + e.kind);
    put(tid + ':' + e.kind, { id: tid, logo: tq, name, kind: e.kind }, e.sp);
  }
  for (const t of wd.values()) {
    if (seen.has(t.id + ':' + t.kind) || teams.has(t.id + ':' + t.kind)) continue;
    if (t.kind === 'club' && hasClubs) continue;   // bilgi kutusu varsa kulüp listesi oradan
    if (t.kind === 'youth' && hasYouth) continue;  // altyapı listesi de öyle
    teams.set(t.id + ':' + t.kind, t);
  }

  // Aynı altyapı takımı iki kaynaktan farklı yazılmış olabilir: "Türkiye U-19" = "Türkiye 19 Yaş Altı"
  const youthKey = n => fold(n).replace(/(\d{2})\s*yas\s*alti/, 'u$1').replace(/under[\s-]?(\d{2})/, 'u$1')
    .replace(/\bu-?\s?(\d{2})/, 'u$1').replace(/national|mill[iî]|futbol|football|takimi|team|association/g, '').replace(/[^a-z0-9]/g, '');
  const byYouth = new Map();
  for (const [k, t] of [...teams]) {
    if (t.kind !== 'youth') continue;
    const yk = youthKey(t.name), prev = byYouth.get(yk);
    if (!prev) { byYouth.set(yk, k); continue; }
    const keep = teams.get(prev), hasYears = x => x.s.some(sp => sp[0]);
    if (!hasYears(keep) && hasYears(t)) { t.logo ||= keep.logo; teams.delete(prev); byYouth.set(yk, k); }
    else { keep.logo ||= t.logo; teams.delete(k); }
  }

  const list = [...teams.values()];
  list.forEach(t => t.s.sort((x, y) => (x[0] || 9999) - (y[0] || 9999)));
  list.sort((x, y) => (x.s[0]?.[0] || 9999) - (y.s[0]?.[0] || 9999));
  const curQ = curL ? q[curL.wiki][curL.title] || null : null;
  const d = { teams: list, cur: curQ };
  LS.set(key, { t: Date.now(), d });
  return d;
}

function prefetch(){
  const { a, b } = state;
  if (!a || !b || a.id === b.id) return null;
  const k = pairKey(a.id, b.id);
  if (!pending[k]) pending[k] = fetchPair(a.id, b.id).catch(e => { delete pending[k]; throw e; });
  return pending[k];
}

// Sıralama: ünlülük + güncellik birlikte
function score(players, a, b){
  return players.map(p => {
    const cur = p.now === a || p.now === b ? p.now : null;
    const all = [...p.s[a], ...p.s[b]];
    const last = Math.max(0, ...all.map(sp => sp[1] || (!sp[1] && cur ? NOW : sp[0]) || 0));
    const ago = last ? Math.max(0, NOW - last) : 30;
    return { ...p, cur, smart: p.links * (0.35 + 0.65 * Math.exp(-ago / 12)) * (cur ? 1.3 : 1) };
  }).sort((x, y) => y.smart - x.smart).map((p, i) => ({ ...p, rank: i + 1 }));
}

const wait = ms => new Promise(r => { const t = setTimeout(r, ms); wake = () => { clearTimeout(t); r(); }; });
async function start(){
  const req = prefetch(); if (!req) return;
  const { a, b } = state;
  skipped = false;
  $('count').classList.add('on');
  for (const n of ['3','2','1']) {
    const el = $('num'); el.className = 'num'; el.textContent = n; void el.offsetWidth; el.className = 'num pop';
    if (navigator.vibrate) navigator.vibrate(30);
    await wait(800);
    if (skipped) break;
  }
  showResults(a, b, req);
  $('count').classList.remove('on');
}
$('go').addEventListener('click', start);

/* ---------- Sonuçlar ---------- */
async function showResults(a, b, req){
  state.key = pairKey(a.id, b.id); state.players = []; state.filter = ''; state.onlyNow = false; state.loading = true; state.verifying = true;
  $('filter').value = ''; $('onlyNow').classList.remove('on');
  $('resMatch').innerHTML = `<div class="t">${crest(a.id,'hd')}<span>${esc(a.name)}</span></div>
    <div class="v">VS</div><div class="t"><span>${esc(b.name)}</span>${crest(b.id,'hd')}</div>`;
  paintLogos($('resMatch'));
  $('tools').style.display = 'none';
  $('resList').innerHTML = '<div class="skel"></div>'.repeat(5);
  if (!$('results').classList.contains('open')) openLayer($('results'));
  try {
    const data = await req;
    if (state.key !== pairKey(a.id, b.id)) return;
    state.players = score(data, a.id, b.id);
    state.loading = false;
    renderList(true);
    verifyPair(a.id, b.id, data).catch(() => {}).finally(() => {
      if (state.key !== pairKey(a.id, b.id)) return;
      state.verifying = false;
      state.players = score(data, a.id, b.id);
      renderList(false);
    });
  } catch (e) {
    if (state.key !== pairKey(a.id, b.id)) return;
    $('resList').innerHTML = `<div class="none"><b>${TEXT.connProblem}</b><span>${esc(e.message)}</span><br>
      <button class="ghost" id="retry">${TEXT.retry}</button></div>`;
    $('retry').onclick = () => showResults(a, b, prefetch());
  }
}

function renderList(animate){
  if (state.loading) return;   // veri gelmeden "ortak oyuncu yok" deme
  const { a, b } = state, P = state.players;
  if (!P.length) {
    $('tools').style.display = 'none';
    $('resList').innerHTML = `<div class="none"><b>${TEXT.none}</b><span>${TEXT.noneSub}</span></div>`;
    return;
  }
  $('tools').style.display = '';
  const q = fold(state.filter.trim());
  const shown = P.filter(p => (!state.onlyNow || p.cur) && (!q || fold(p.name).includes(q)));
  $('resCount').innerHTML = TEXT.count(shown.length, state.onlyNow);
  if (state.onlyNow && state.verifying) {
    $('resCount').innerHTML = TEXT.count('…', true);
    $('resList').innerHTML = `<div class="empty-msg">${TEXT.checking}</div>`;
    return;
  }
  $('resList').classList.toggle('calm', !animate);
  if (!shown.length) {
    $('resList').innerHTML = `<div class="empty-msg">${q ? TEXT.noName : TEXT.noNow}</div>`;
    return;
  }
  const max = Math.max(...P.map(p => p.links));
  $('resList').innerHTML = shown.map((p, i) => {
    const sp = t => `<span class="sp">${crest(t.id,'xs')}${p.s[t.id].map(x => years(x, p.cur === t.id)).join(', ')}</span>`;   // yılı bilinmiyorsa sadece arma
    return `<button class="pl ${p.rank <= 3 ? 'r' + p.rank : ''}" data-pid="${p.id}" style="animation-delay:${Math.min(i, 12) * 30}ms">
      <div class="rk">${p.rank}</div>${face(p)}
      <div>
        <span class="pn">${esc(p.name)}</span>${p.cur ? `<span class="now">${esc(TEXT.nowAt(p.cur === a.id ? a.name : b.name))}</span>` : ''}
        <div class="sps">${sp(a)}${sp(b)}</div>
        <div class="fame"><i style="width:${Math.max(4, p.links / max * 100).toFixed(0)}%"></i></div>
      </div></button>`;
  }).join('');
  paintLogos($('resList'));
}

$('filter').addEventListener('input', e => { state.filter = e.target.value; renderList(false); });
$('onlyNow').addEventListener('click', () => {
  state.onlyNow = !state.onlyNow; $('onlyNow').classList.toggle('on', state.onlyNow); renderList(false);
});
// Listedeki oyuncuya dokununca kariyerini aç
$('resList').addEventListener('click', e => {
  const b = e.target.closest('[data-pid]'); if (!b) return;
  const p = state.players.find(x => x.id === b.dataset.pid);
  if (p) { $('filter').blur(); openLayer($('career')); showCareer({ id: p.id, name: p.name, img: p.img, desc: '' }); }
});
$('again').addEventListener('click', () => { state.a = state.b = null; renderSlots(); back(); });
$('resRandom').addEventListener('click', () => { randomPair(); back(); });

/* ---------- Kariyer ---------- */
async function showCareer(p, remember){
  if (remember) {
    const rec = (LS.get('recentp_v1') || []).filter(x => x.id !== p.id);
    rec.unshift({ id: p.id, name: p.name, desc: p.desc || '', img: p.img || null });
    LS.set('recentp_v1', rec.slice(0, 8));
  }
  const body = $('careerBody');
  body.scrollTop = 0;
  body.innerHTML = `<div class="hero">${face(p)}<div><h2>${esc(p.name)}</h2>${p.desc ? `<p>${esc(p.desc)}</p>` : ''}</div></div>
    <div class="clubs">${'<div class="skel"></div>'.repeat(4)}</div>`;
  try {
    const { teams, cur: curTeam } = await fetchCareer(p.id);
    teams.forEach(t => { names[t.logo || t.id] ??= t.name; names[t.id] ??= t.name; });
    const tag = t => crest(t.logo || t.id, '').replace('class="crest ', `class="crest ${t.logo ? '' : 'nologo '}`);
    const row = (t, i) => {
      const cur = t.kind === 'club' && t.id === curTeam;
      return `<div class="club ${cur ? 'cur' : ''}" style="animation-delay:${Math.min(i, 15) * 25}ms">${crest(t.logo || t.id, 'md')}
        <div><b>${esc(t.name)}${cur ? `<span class="now">${TEXT.nowShort}</span>` : ''}</b><small>${t.s.map(sp => years(sp, cur)).join(' · ')}</small></div></div>`;
    };
    const mini = t => `<div class="mini">${crest(t.logo || t.id, 'xs')}<span>${esc(t.name)}</span><small>${t.s.map(sp => years(sp, false)).join(' · ')}</small></div>`;
    const clubs = teams.filter(t => t.kind === 'club'), nat = teams.filter(t => t.kind === 'nat'), youth = teams.filter(t => t.kind === 'youth');
    body.querySelector('.clubs').innerHTML = !teams.length ? `<div class="empty-msg">${TEXT.noRecords}</div>`
      : (clubs.length ? `<div class="label">${TEXT.clubs(clubs.length)}</div>${clubs.map(row).join('')}` : '') +
        (nat.length ? `<div class="label sec">${TEXT.national}</div>${nat.map((t, i) => row(t, clubs.length + i)).join('')}` : '') +
        (youth.length ? `<div class="label sec">${TEXT.youth}</div><div class="minis">${youth.map(mini).join('')}</div>` : '');
    paintLogos(body);
    ensureLogos(teams.map(t => t.logo).filter(Boolean));
  } catch (e) {
    body.querySelector('.clubs').innerHTML = `<div class="empty-msg">${TEXT.connProblem}: ${esc(e.message)}</div>`;
  }
}

/* ---------- Başlangıç ---------- */
// iPhone ana ekran uygulaması: yüksekliğe ASLA dokunma (screen.height butonları ekran dışına itiyordu).
// Eski simgelerde (black-translucent) Safari alanı altta kısa bırakabiliyor; o zaman ev çubuğu zaten
// alanın dışında kaldığı için ayrıca alt dolgu ekleme.
function fitBottom(){
  const probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px)';
  document.body.appendChild(probe);
  const safeTop = parseFloat(getComputedStyle(probe).paddingTop) || 0;
  probe.remove();
  const portrait = matchMedia('(orientation: portrait)').matches;
  const short = navigator.standalone === true && portrait && safeTop > 0 && screen.height - innerHeight > 20;
  if (short) document.documentElement.style.setProperty('--pad-b', '12px');
  else document.documentElement.style.removeProperty('--pad-b');
}
fitBottom();
addEventListener('resize', fitBottom);
$('random').textContent = TEXT.random;
$('careerBtn').textContent = TEXT.career;
$('onlyNow').innerHTML = `<i></i>${TEXT.current}`;
$('filter').placeholder = TEXT.filter;
$('again').textContent = TEXT.again;
$('career').querySelector('.title').textContent = TEXT.careerTitle;
$('count').querySelector('small').textContent = TEXT.skip;
$('lang').textContent = TEXT.other;
$('lang').addEventListener('click', () => { LS.set('lang', LANG === 'tr' ? 'en' : 'tr'); location.reload(); });
renderSlots();
ensureLogos(POPULAR.map(t => t.id));
</script>
</body>
